<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Brain · 知识库导入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220;
            --surface: rgba(18, 28, 46, 0.82);
            --ink: #e8eef8;
            --muted: #8b9bb4;
            --line: rgba(120, 170, 255, 0.14);
            --accent: #2fd4c8;
            --accent-2: #4d8dff;
            --font-display: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            --font-body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--ink);
            display: flex;
            justify-content: center;
            padding: 28px 18px;
            background:
                radial-gradient(900px 520px at 8% -8%, rgba(47, 212, 200, 0.16), transparent 55%),
                radial-gradient(720px 420px at 92% 0%, rgba(77, 141, 255, 0.18), transparent 52%),
                linear-gradient(165deg, #070b14 0%, #0d1524 45%, #0a1220 100%);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(120, 170, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 170, 255, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            animation: rise 0.45s ease both;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(145deg, var(--accent), var(--accent-2));
            box-shadow:
                0 0 0 1px rgba(47, 212, 200, 0.3),
                0 10px 24px rgba(47, 212, 200, 0.25);
            display: grid;
            place-items: center;
            color: #061018;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 18px;
        }

        .brand-text strong {
            display: block;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .brand-text span {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .container {
            background: var(--surface);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            animation: rise 0.55s ease both;
        }

        h1 {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(120deg, #f4f8ff 10%, #2fd4c8 55%, #4d8dff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .lead {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .upload-area {
            border: 1.5px dashed rgba(47, 212, 200, 0.35);
            background:
                linear-gradient(135deg, rgba(47, 212, 200, 0.06), rgba(77, 141, 255, 0.04)),
                rgba(8, 14, 26, 0.45);
            border-radius: 16px;
            padding: 44px 28px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            inset: -40%;
            background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.06), transparent 60%);
            transform: translateX(-30%);
            transition: transform 0.6s ease;
            pointer-events: none;
        }

        .upload-area:hover {
            border-color: rgba(47, 212, 200, 0.7);
            box-shadow: 0 12px 32px rgba(47, 212, 200, 0.12);
            transform: translateY(-1px);
        }

        .upload-area:hover::before {
            transform: translateX(30%);
        }

        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(47, 212, 200, 0.1);
            box-shadow: inset 0 0 0 1px rgba(47, 212, 200, 0.25);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 22px;
            background: linear-gradient(145deg, var(--accent), var(--accent-2));
            color: #061018;
            box-shadow: 0 10px 24px rgba(47, 212, 200, 0.28);
            font-family: var(--font-display);
            font-weight: 700;
        }

        .upload-text {
            color: #d5e2f5;
            font-size: 15px;
            font-weight: 500;
        }

        .upload-hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .file-input { display: none; }

        .file-list {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .file-item {
            background:
                linear-gradient(160deg, rgba(24, 38, 62, 0.92), rgba(14, 22, 38, 0.88));
            border: 1px solid rgba(120, 170, 255, 0.14);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            animation: rise 0.35s ease both;
        }

        .file-item:hover {
            transform: translateY(-2px);
            border-color: rgba(47, 212, 200, 0.28);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .file-name {
            font-family: var(--font-display);
            font-weight: 600;
            color: #f2f7ff;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: 0.04em;
            color: #061018;
            min-width: 76px;
            text-align: center;
            flex-shrink: 0;
        }

        .status-uploading {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }

        .status-processing {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 6px 16px rgba(47, 212, 200, 0.25);
        }

        .status-completed {
            background: linear-gradient(135deg, #34d399, #10b981);
        }

        .status-error {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
        }

        .progress-wrapper {
            margin-top: 4px;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(8, 14, 26, 0.8);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(120, 170, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
        }

        .progress-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.28) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 1.8s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-family: var(--font-display);
        }

        .log-details {
            margin-top: 14px;
            font-size: 13px;
            color: #c5d3e8;
            background: rgba(6, 12, 22, 0.55);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(47, 212, 200, 0.16);
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: #dce6f5;
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 12px;
            font-family: var(--font-display);
            letter-spacing: 0.02em;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            list-style: none;
        }

        .log-details summary::-webkit-details-marker { display: none; }

        .log-details summary::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px rgba(47, 212, 200, 0.7);
            flex-shrink: 0;
        }

        .log-details[open] summary { margin-bottom: 4px; }

        .log-details summary:hover { color: var(--accent); }

        .log-list {
            margin: 8px 0 0 0;
            padding: 0 0 0 20px;
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            position: relative;
        }

        .log-list::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(180deg, rgba(47, 212, 200, 0.45), rgba(77, 141, 255, 0.35));
            border-radius: 1px;
        }

        .log-list::-webkit-scrollbar { width: 6px; }
        .log-list::-webkit-scrollbar-thumb {
            background: rgba(139, 155, 180, 0.35);
            border-radius: 3px;
        }

        .log-list li {
            margin: 0;
            padding: 10px 12px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            position: relative;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .log-list li:hover { background: rgba(255, 255, 255, 0.03); }

        .log-list li::before {
            content: "";
            position: absolute;
            left: -17px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: #1e293b;
            box-shadow: 0 0 0 3px rgba(8, 14, 26, 0.85);
            z-index: 1;
        }

        .log-done { color: #d1fae5; }

        .log-done::before {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 8px rgba(47, 212, 200, 0.45), 0 0 0 3px rgba(8, 14, 26, 0.85) !important;
        }

        .log-duration {
            margin-left: auto;
            font-size: 11px;
            color: #9ee9e1;
            background: rgba(47, 212, 200, 0.1);
            border: 1px solid rgba(47, 212, 200, 0.25);
            padding: 2px 10px;
            border-radius: 999px;
            white-space: nowrap;
            font-weight: 600;
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .log-running {
            color: #bae6fd;
            animation: pulseText 2s infinite;
        }

        .log-running::before {
            background: var(--accent-2) !important;
            border-color: var(--accent-2) !important;
            box-shadow: 0 0 8px rgba(77, 141, 255, 0.5), 0 0 0 3px rgba(8, 14, 26, 0.85) !important;
            animation: pulseNode 2s infinite !important;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes pulseNode {
            0%, 100% {
                box-shadow: 0 0 8px rgba(77, 141, 255, 0.5), 0 0 0 3px rgba(8, 14, 26, 0.85);
            }
            50% {
                box-shadow: 0 0 14px rgba(77, 141, 255, 0.85), 0 0 0 3px rgba(8, 14, 26, 0.85);
            }
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .container { padding: 18px; }
            .file-item { flex-direction: column; }
            .status-badge { align-self: flex-start; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
            <strong>Agent Brain</strong>
            <span>Import · RAG Pipeline</span>
        </div>
    </div>

    <div class="container">
        <h1>知识库导入</h1>
        <p class="lead">上传 PDF / Markdown，系统会按流水线切分、识别、向量化并入库。</p>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">↑</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持 .pdf / .md</div>
            <input type="file" id="fileInput" class="file-input" accept=".pdf,.md">
        </div>

        <div id="fileList" class="file-list"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    const API_BASE = 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
        } else if (safePercentage < 10) {
            bar.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
        } else {
            bar.style.background = 'linear-gradient(90deg, #4d8dff, #2fd4c8)';
        }
    }

    async function uploadFile(file) {
        const isPDF = file.name.toLowerCase().endsWith('.pdf');
        const totalNodes = isPDF ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);

        try {
            progressWrapper.style.display = 'block';

            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');

            const result = await response.json();
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = "网络请求失败或服务器异常";
            errLog.style.color = "#f87171";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    function formatDuration(seconds) {
        if (seconds < 60) {
            return seconds.toFixed(1) + 's';
        }
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        let currentPercentage = (done.length / totalNodes) * 100;

        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }

        let totalDuration = 0;
        for (const key in durationMap) {
            totalDuration += durationMap[key];
        }
        const totalDurationText = totalDuration > 0 ? ` · 总耗时 ${formatDuration(totalDuration)}` : '';

        logSummary.textContent = `运行日志 · 已完成 ${done.length} · 进行中 ${running.length} · 共 ${totalNodes} 步${totalDurationText}`;

        logListEl.innerHTML = '';

        for (const item of done) {
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${normalizeLogText(item)} 节点执行完成`;
            li.appendChild(nameSpan);

            if (durationMap[item] !== undefined) {
                const durationSpan = document.createElement('span');
                durationSpan.className = 'log-duration';
                durationSpan.textContent = formatDuration(durationMap[item]);
                li.appendChild(durationSpan);
            }

            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;

            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                if (stopped) return;

                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);

                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "工作流执行失败中止";
                    errLog.style.color = "#f87171";
                    logListEl.appendChild(errLog);

                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>

</body>
</html>
